# Konfigurasi situs (dipakai bersama oleh listener HTTP-internal dan HTTPS).
# Dipanggil dari nginx.conf: include /etc/nginx/site/lacakedu.conf
# Listener HTTP-internal dipakai cloudflared (tunnel), listener 443 dipakai
# Cloudflare proxy atau klien langsung ke VPS.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
# OSM tile policy mensyaratkan Referer; no-referrer membuat tile diblokir 403.
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
# Next.js juga mengirim header ini -> dua salinan (testssl: "multiple
# headers"). Sembunyikan duplikat dari upstream, edge yang jadi sumber.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;

client_max_body_size 60M;

# JANGAN teruskan $proxy_add_x_forwarded_for (bisa dipalsukan klien).
location /healthz { return 200 'ok'; }

location /socket.io/ {
  set $worker_upstream lacakedu-worker:3001;
  proxy_pass http://$worker_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 86400;
}

location / {
  set $web_upstream lacakedu-web:3000;
  proxy_pass http://$web_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Tulis ulang XFF: nilai dari klien tidak boleh dipercaya (rate limit &
  # audit pakai IP ini). $remote_addr sudah = IP asli klien setelah real_ip.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
}
