# SATU config untuk SEMUA sekolah. Tidak ada block per sekolah.
# Resolusi: web membaca Host (<slug>.lacakedu.web.id) -> SELECT publik School -> runAsSchool.
#
# TLS berhenti di Cloudflare (cloudflared tunnel). Origin hanya HTTP di
# 127.0.0.1:8080 dan tidak punya port publik / sertifikat sama sekali.
events {
  worker_connections 1024;
}

http {
  # Resolve per request (cache 10 dtk): IP container berubah setiap restart.
  # Tanpa ini nginx hanya resolve saat start -> 502 setelah web di-restart.
  # Gateway aardvark-dns = 10.89.0.1 (auto-assign subnet podman).本地_IP tetap
  # stabil selama jaringan ini tidak dihapus dan dibuat ulang (podman 4.6).
  resolver 10.89.0.1 valid=10s ipv6=off;

  # cloudflared jalan di host dan mengirim CF-Connecting-IP. Tanpa real_ip,
  # $remote_addr = gateway podman untuk semua klien -> rate limit per-IP longgar.
  set_real_ip_from 10.89.0.0/24;
  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;

  server {
    listen 80;
    server_name *.lacakedu.web.id lacakedu.web.id;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # OSM tile policy mensyaratkan Referer; no-referrer membuat tile diblokir 403.
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 60M;

    # JANGAN teruskan $proxy_add_x_forwarded_for (bisa dipalsukan klien).
    location /healthz { return 200 'ok'; }

    location /socket.io/ {
      set $worker_upstream lacakedu-worker:3001;
      proxy_pass http://$worker_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }

    location / {
      set $web_upstream lacakedu-web:3000;
      proxy_pass http://$web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
