# SATU config untuk SEMUA sekolah. Tidak ada block per sekolah.
# Resolusi: web membaca Host (<slug>.lacakedu.web.id) -> SELECT publik School -> runAsSchool.
#
# Tiga listener:
#   80   -> origin internal untuk cloudflared (tunnel). HTTP polos, TIDAK dialihkan.
#   8081 -> HTTP publik -> 301 ke HTTPS (dipakai lewat PublishPort host 80).
#   443  -> HTTPS publik (Cloudflare proxy ke origin, atau klien langsung).
#
# Konfigurasi lokasi (location ...) ada di lacakedu-site.conf supaya tidak
# diduplikasi di dua listener.
events {
  worker_connections 1024;
}

http {
  # Jangan bocorkan versi nginx ke klien.
  server_tokens off;

  # Resolve per request (cache 10 dtk): IP container berubah setiap restart.
  # Tanpa ini nginx hanya resolve saat start -> 502 setelah web di-restart.
  # Gateway aardvark-dns = 10.89.0.1 (auto-assign subnet podman). IP ini tetap
  # stabil selama jaringan ini tidak dihapus dan dibuat ulang (podman 4.6).
  resolver 10.89.0.1 valid=10s ipv6=off;

  # cloudflared jalan di host dan mengirim CF-Connecting-IP. Tanpa real_ip,
  # $remote_addr = gateway podman untuk semua klien -> rate limit per-IP longgar.
  set_real_ip_from 10.89.0.0/24;
  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;

  # Origin internal untuk tunnel cloudflared.
  server {
    listen 80;
    server_name *.lacakedu.web.id lacakedu.web.id;
    include /etc/nginx/site/lacakedu.conf;
  }

  # HTTP publik -> HTTPS.
  server {
    listen 8081;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS publik. Sertifikat dari acme.sh (DNS-01 Cloudflare) di /etc/nginx/certs.
  server {
    listen 443 ssl;
    http2 on;
    server_name *.lacakedu.web.id lacakedu.web.id;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/site/lacakedu.conf;
  }
}
