# SATU config untuk SEMUA sekolah. Tidak ada block per sekolah.
# Resolusi: web membaca Host (<slug>.domainmu.id) -> SELECT publik School -> runAsSchool.
# TLS: wildcard publik via DNS-01 -> /etc/nginx/certs/{fullchain.pem,privkey.pem}.
#
# PENERBITAN PERTAMA — SEBELUM nginx dijalankan (cert harus sudah ada):
#   export DNS_API=dns_cf  # sesuaikan provider DNS
#   acme.sh --issue --dns "$DNS_API" -d 'domainmu.id' -d '*.domainmu.id'
#   acme.sh --install-cert -d 'domainmu.id' \
#     --fullchain-file ~/sms-lms/certs/fullchain.pem \
#     --key-file ~/sms-lms/certs/privkey.pem
# Setelah itu nginx boleh start; perpanjangan otomatis via acme-renew.timer.

events {
  worker_connections 1024;
}

http {
  upstream web { server 127.0.0.1:3000; }
  upstream worker { server 127.0.0.1:3001; }

  server {
    listen 80;
    server_name *.domainmu.id domainmu.id;
    location /healthz { return 200 'ok'; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    server_name *.domainmu.id;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 25M;

    # JANGAN teruskan $proxy_add_x_forwarded_for (bisa dipalsukan klien).
    # Rate limit login membaca X-Real-IP = $remote_addr (butuh pasta, lihat .pod).
    location /healthz { return 200 'ok'; }

    location /socket.io/ {
      proxy_pass http://worker;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
